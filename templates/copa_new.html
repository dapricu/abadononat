{% extends 'base.html' %}
{% block title %}Nueva Copa de Clubs{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-4">Nueva Copa de Clubs</h1>
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nombre *</label>
        <input type="text" name="name" class="form-control" required
               placeholder="Copa División Honor 2026 – Clasificación conjunta">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Crear Copa</button>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
